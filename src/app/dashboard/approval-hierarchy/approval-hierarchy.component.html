<div class="list-table">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <div class="right-side" style="display: flex; align-items: center; gap: 16px;">
      <div class="logo" style="display: flex; align-items: center;">
        <img src="../../../assets/logo-datasoft.svg" alt="datasoft logo" style="width: 120px; height: auto;">
      </div>
    </div>
  </div>

  <div class="labels">
    <div class="kpi">
      <h5 style="color:#AD94FF;">{{ label }}</h5>
    </div>
    <div class="actions">
      <div class="search-wrapper">
        <input type="text" placeholder="Search Here" class="search-input">
        <img src="../../../assets/magnifine-bar.svg" class="search-icon" />
      </div>
    </div>
  </div>

  <div class="table-scroll-wrapper">
    <div class="table-x-scroll">
      <table>
        <thead>
        <tr>
          <th>Sl No</th>
          <th>Team</th>
          <th>Approval Hierarchy</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let user of userList; let i = index">
          <td>{{ i + 1 }}</td>
          <td title="{{ user.team }}">{{ user.team }}</td>
          <td title="{{ user.designation }}">{{ user.designation }}</td>
          <td class="text-center">
            <img src="../../../assets/edit.svg" alt="actions" (click)="edit()" />
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
