<div class="list-table">
  <div class="d-flex justify-content-end align-items-center mb-5">


    <div class="right-side" style="display: flex; align-items: center; gap: 16px;">

      <div class="logo" style="display: flex; align-items: center;">
        <img src="../../../assets/logo-datasoft.svg" alt="datasoft logo" style="width: 120px; height: auto;">
      </div>
    </div>


  </div>

  <div class="labels">
    <div class="kpi">
      <h5 style="color:#AD94FF;">{{ label }}</h5>
    </div>
    <div class="actions">
      <button  (click)="onClick()" *ngIf="isShowAdd">+ Add New</button>
      <div class="search-wrapper"  (keydown.enter)="search()" >
        <input type="text" placeholder="Search Here" [(ngModel)]="searchParam" class="search-input" >
        <img src="../../../assets/magnifine-bar.svg" (click)="search()" class="search-icon" />
      </div>
    </div>
  </div>

  <!-- Table scroll wrapper -->
  <div class="table-scroll-wrapper">
    <div class="table-x-scroll">
      <table>
        <thead>
        <tr>
          <th>Sl No</th>
          <th>Year</th>
<!--          <th>Designation</th>-->
          <th>Team</th>
<!--          <th>Manager</th>-->
          <th>Status</th>
          <th>SBU</th>
          <th>Hierarchy</th>
          <th>Remarks</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let user of resData; let i = index" >
          <td>{{ i + 1 }}</td>
          <td title="{{ user.year }}">{{ user.year }}</td>
<!--          <td title="{{ user.team }}">{{ user.team }}</td>-->
          <td [title]="user.team">
            {{ user.team.length > 15 ? (user.team | slice:0:15) + '...' : user.team }}
          </td>
          <td title="{{ user.status }}" [ngClass]="getStatusClass(user.status)">{{ user.status }} </td>
          <td title="{{ user.SBU }}">{{ user.sbu }}</td>
          <td title="{{ user.hieCount }}" style="cursor:pointer;position: relative;">
            <div class="dropdown" style="position: relative;">
              <span
                class="text-white"
                role="button"
                data-bs-toggle="dropdown"
                data-bs-display="static"
                aria-expanded="false"
                (click)="openHierarchy(user, $event)">
                <ul style="color:#fff;">{{ user.hieCount }}</ul>
              </span>

              <div #dropdownMenu class="dropdown-menu hierarchy-dropdown dropdown-options p-4">
                <div style="font-size:16px; color:white; font-weight:bold;">Hierarchy</div>
                <div class="w-100">
                  <div *ngFor="let u of fullHierarchy" >
                    <div style="font-size:14px; color:white;">{{ u.user_name }}</div>
                    <div class="dropdown-divider"></div>
                  </div>
                </div>
              </div>
            </div>



          </td>
          <td class="remarks-cell" title="{{ user.remarks }}">
           <span class="remarks"> ({{ user.remarks }})</span><img src="../../../assets/comment.svg" />
          </td>
          <td class="text-center">
            <img src="../../../assets/clear-eye.svg" alt="actions"
                 src="../../../assets/clear-eye.svg"
                 alt="View details"
                 [ngStyle]="{
                    cursor: user.edit_permission == true  ? 'pointer' : 'not-allowed',
                    opacity: user.edit_permission == true  ? 1 : 0.4,
                    'pointer-events': user.edit_permission == true  ? 'all' : 'none'
                  }"

                 (click)="viewClick(user)"
            />

          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
