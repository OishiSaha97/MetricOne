
<div class="container-fluid kpi-page py-4">
  <!-- Header -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 header-section">
    <div class="d-flex align-items-center">
      <img src="../../assets/logo-nav.svg" alt="MetricOne Logo" class="logo me-2" />
    </div>

    <div class="text-end text-light header-info">
      <div><strong class="font-color-system">Year:</strong> 2025 | <strong class="font-color-system">KPI of</strong> Sharmilie Nawar</div>
<!--      <div><strong>Team:</strong> bKash | <strong>Designation:</strong> Business Analyst | <a href="#" class="text-primary">View as: Manager</a></div>-->
    </div>
  </div>

  <div class="container-fluid py-4">
    <!-- Header -->
    <div class="row d-flex flex-wrap justify-content-between align-items-center mb-4 header-section">
      <div class="row d-flex align-items-center">
        <div class="col-md-4">
          <span class="font-color-system">Team: </span>
          <span>bKash</span>
        </div>

        <div class="col-md-4">
          <span class="font-color-system">Designation: </span>
          <span>Business Analyst</span>
        </div>

        <div class="col-md-4">
          <span class="font-color-system">View as: </span>
          <span>Manager </span>
        </div>
      </div>
    </div>
  </div>



  <!-- Title -->
  <h5 class="text-info mb-3 fw-bold">INITIAL KPI SETTING</h5>

  <!-- Main Content -->
  <div class="row g-4">
    <div class="col-lg-4 col-md-4">
      <div class="d-flex step-section p-3 rounded">
        <span class="step-number">1</span>
        <h6 class="mt-2 text-light" style="margin-left: 6%;">Objective Set for the Year</h6>
      </div>
    </div>

    <div class="col-lg-8 col-md-8">
      <div class="objectives-card p-4 rounded">
        <h5 class="text-light fw-semibold">Objectives Set for Year 2025</h5>
        <p class="text-secondary small">
          Please write SMART Objective statements:
          <span >Stretching</span>,
          <span >Measurable</span>,
          <span >Agreed</span>,
          <span >Realistic</span>,
          <span >Time-Bound</span>.
        </p>

        <div class="container mt-3">

          <!-- Loop through objectives -->
          <div *ngFor="let obj of objectives" class="objective-box p-3 rounded mb-3 bg-dark text-light">

            <!-- Header (click to toggle) -->
            <div class="d-flex justify-content-between align-items-center mb-2"
                 (click)="toggleObjective(obj)"
                 style="cursor:pointer;">

              <span class="fw-semibold">{{ obj.title }}</span>

              <select
                class="form-select form-select-sm w-auto"
                (click)="$event.stopPropagation()"
                (change)="onObjectiveChange($event, obj)"
                [(ngModel)]="obj.selectedType"
              >
                <option value="">Select Category</option>
                <option *ngFor="let type of objectiveTypes" [value]="type">
                  {{ type }}
                </option>
              </select>

            </div>

            <!-- Collapsible content -->
            <div *ngIf="obj.isOpen" class="collapse-content">
              <label class="text-secondary small">OBJECTIVE</label>
              <input
                type="text"
                class="form-control mb-2"
                [(ngModel)]="obj.objectiveText"
                placeholder="Enter objective..."
              />

              <label class="text-secondary small">TARGET</label>
              <textarea
                rows="4"
                class="form-control small"
                [(ngModel)]="obj.targetText"
                placeholder="Enter target..."
              ></textarea>
            </div>
          </div>

          <!-- Add new objective -->
          <button class="btn btn-info mt-2" (click)="addObjective()">
            + Add Work Objective
          </button>
        </div>


        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-outline-light">Cancel</button>
<!--          <button class="btn btn-outline-success">Revert</button>-->
          <button class="btn btn-primary" (click)="onSubmit()">Submit</button>
        </div>
      </div>
    </div>
  </div>
</div>
