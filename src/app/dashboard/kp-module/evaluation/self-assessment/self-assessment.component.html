<div class="objectives-card p-4 rounded" [class.view-mode]="view === 0">
  <h5 class="text-light fw-semibold">Self Assessment </h5>
  <p class="text-secondary small">
    Please answer each question thoughtfully, reflecting on your accomplishments, challenges, and areas for growth or support.

  </p>

  <div class=" mt-3">
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3">Self Evaluation </div>
          <div>
            <!--            <button class="btn btn-dark m-3"-->
            <!--                    type="button"-->
            <!--                    style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 51px">-->
            <!--              {{  'Rating' }}-->
            <!--            </button>-->

          </div>
        </div>

        <div *ngFor="let obj of objectives; let i = index;" class="objective-box p-3 text-light"
             [ngClass]="{ 'bg-open': obj.isOpen }">
          <div class="d-flex justify-content-between align-items-center"

               style="cursor:pointer;">
            <div class="d-flex justify-content-between"  (click)="toggleObjective(obj)">
              <div>
                <img src="../../../assets/work_obj.svg" class="mb-1" style="scale:0.7"  />
              </div>
              <span class="fw-semibold">{{ obj.title }}</span>
            </div>
            <div class="dropdown">

            </div>


          </div>
          <div *ngIf="obj.isOpen" class="collapse-content">
            <hr style="width: 104%;margin-left: -18px;">
            <div class="d-flex justify-content-end align-items-center">


            </div>
            <textarea
              type="text"
              style="height: 41px;"
              class="obj-input mb-2 mt-2"
              [(ngModel)]="obj.selfText"
              placeholder="Type Here"
              [readonly]="currentStatus === 'manager' || currentStatus === 'approver'"
              [disabled]=" userData.status === 'Closed'"></textarea>
            <small class="text-danger" style="font-size: 11px;" *ngIf="objectiveErrors[i]?.selfText">
              {{ objectiveErrors[i].selfText }}
            </small>


          </div>

        </div>
      </div>

    </ul>
  </div>

</div>
