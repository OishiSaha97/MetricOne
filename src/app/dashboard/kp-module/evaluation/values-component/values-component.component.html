<div class="objectives-card p-4 rounded">
  <h5 class="text-light fw-semibold">Values</h5>
  <p class="text-secondary small">
    Explain how you demonstrated each value in your daily work and overall performance.

  </p>

  <div class="container mt-3">
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3">Category</div>
          <div>
            <button class="btn btn-dark m-3"
                    type="button"
                    style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 51px">
              {{  'Rating' }}
            </button>

          </div>
        </div>

        <div *ngFor="let obj of objectives; let i = index;" class="objective-box p-3 text-light"
             [ngClass]="{ 'bg-open': obj.isOpen }">

          <div class="d-flex justify-content-between align-items-center" style="cursor:pointer;">
            <div class="d-flex justify-content-between" (click)="toggleObjective(obj)">
<!--              <div>-->
<!--                <img src="../../../assets/work_obj.svg" class="mb-1" style="scale:0.7" />-->
<!--              </div>-->
              <span class="fw-semibold">{{ obj.name }}</span>
            </div>

            <div class="dropdown">
              <button class="btn btn-dark dropdown-toggle"
                      type="button"
                      data-bs-toggle="dropdown"
                      style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 44px;">
                {{ obj.selectedRating || 'Select' }}
              </button>

              <ul class="dropdown-menu dropdown-menu-dark" style="background-color: #33343C;">
                <li *ngFor="let type of rating">
                  <a class="dropdown-item text-light"
                     (click)="onObjectiveChange(type, obj)">
                    {{ type }}
                  </a>
                </li>
              </ul>
            </div>
          </div>

        </div>


      </div>

    </ul>
  </div>

  <div class="container mt-3" *ngIf="currentStatus == 'manager' || currentStatus == 'approver' || currentStatus == 'hr' ">
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3" style="margin-top: 6px;">OVERALL RATING</div>
          <div class="dropdown">
            <button class="btn btn-dark dropdown-toggle m-3"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 44px">
              {{  overAllRating ||'Select Overall Rating' }}
            </button>

            <ul class="dropdown-menu dropdown-menu-dark"
                style="background-color: #33343C;">
              <li *ngFor="let type of rating">
                <a class="dropdown-item text-light"
                   (click)="onOverallRating(type)"
                >
                  {{ type }}
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>

    </ul>
  </div>

</div>
