<div class="objectives-card p-4 rounded">
  <h5 class="text-light fw-semibold">Values</h5>
  <p class="text-secondary small">
    Explain how you demonstrated each value in your daily work and overall performance.

  </p>

  <div class=" mt-3">
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3">Category</div>
          <div>
            <button class=" m-3"
                    type="button"
                    style="background-color:#35363D; border:none;padding: 6px 51px;color:white">
              {{  'Rating' }}
            </button>

          </div>
        </div>
        <ng-container *ngFor="let obj of objectives; let i = index">
        <div *ngIf="i!=7" class="objective-box p-3 text-light"
             [ngClass]="{ 'bg-open': obj.isOpen }">

          <div class="d-flex justify-content-between align-items-center" style="cursor:pointer;" >
            <div class="d-flex justify-content-between" (click)="toggleObjective(obj)">
<!--              <div>-->
<!--                <img src="../../../assets/work_obj.svg" class="mb-1" style="scale:0.7" />-->
<!--              </div>-->
              <span class="fw-semibold">{{ obj.name }}</span>
            </div>

            <div class="dropdown"
                 [class.disabled-dropdown]="userData.status === 'Published' || userData.status === 'Closed'">
              <button class="btn btn-dark dropdown-toggle"
                      type="button"
                      data-bs-toggle="dropdown"
                      [attr.disabled]="userData.status === 'Published' || userData.status === 'Closed' ? true : null"

                      style="background-color:#33343C; border:1px solid #7A7B8299;width: 150px;">
                {{ obj.selectedRating ? (obj.selectedRating.length > 12 ? (obj.selectedRating | slice:0:12) + '...' : obj.selectedRating) : 'Select' }}
              </button>

              <ul class="dropdown-menu dropdown-menu-dark" style="background-color: #33343C;">
                <li *ngFor="let type of ratings">
                  <a class="dropdown-item text-light"
                     [class.disabled-item]="userData.status === 'Published' || userData.status === 'Closed'"
                     (click)="onObjectiveChange(type, obj)">
                    {{ type.kpi_category_name }}
                  </a>
                </li>
              </ul>
            </div>
          </div>


        </div>
        </ng-container>





      </div>

    </ul>
  </div>
  <div class="mt-3">
    <ul class="list-group">
      <div class="work-obj" *ngIf="objectives[7] && (currentStatus === 'manager' || currentStatus === 'approver' || currentStatus === 'hr')">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3" style="margin-top: 6px;">{{ objectives[7].name }}</div>
          <div class="dropdown"
               [class.disabled-dropdown]="userData.status === 'Published' || userData.status === 'Closed'">
            <button class="btn btn-dark dropdown-toggle m-3"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    [attr.disabled]="userData.status === 'Published' || userData.status === 'Closed' ? true : null"
                    style="background-color:#33343C; border:1px solid #7A7B8299;width: 150px;">
              {{ objectives[7].overAllRating ? (objectives[7].overAllRating.length > 12 ? (objectives[7].overAllRating | slice:0:12) + '...' : objectives[7].overAllRating) : 'Select' }}
            </button>

            <ul class="dropdown-menu dropdown-menu-dark"
                style="background-color: #33343C;">
              <li *ngFor="let type of ratings">
                <a class="dropdown-item text-light"
                   [class.disabled-item]="userData.status === 'Published' || userData.status === 'Closed'"
                   (click)="onOverAllRating(type, objectives[7])"
                >
                  {{ type.kpi_category_name }}
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>
    </ul>
  </div>



</div>
