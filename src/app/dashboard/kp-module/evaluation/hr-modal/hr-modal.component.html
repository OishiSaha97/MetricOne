<div class="objectives-card p-4 rounded">
  <h5 class="text-light fw-semibold">HR's Insight</h5>

  <div class="container mt-3">
    <ul class="list-group">
      <div class="work-obj">
      <div class="d-flex justify-content-start">
        <div class="fw-semibold p-3">Category</div>
      </div>

      <div *ngFor="let obj of objectives; let i = index;" class="objective-box p-3 text-light"
             [ngClass]="{ 'bg-open': obj.isOpen }">
          <div class="d-flex justify-content-between align-items-center"

               style="cursor:pointer;">
            <div class="d-flex justify-content-between"  (click)="toggleObjective(obj)">
              <div>
                <img src="../../../assets/work_obj.svg" class="mb-1" style="scale:0.7"  />
              </div>
              <span class="fw-semibold">{{ obj.name }}</span>
            </div>

          </div>
        <div *ngIf="obj.isOpen" class="collapse-content">
          <hr style="width: 104%;margin-left: -18px;">
          <input
            type="text"
            class="obj-input mb-2"
            [(ngModel)]="obj.objectiveText"
            placeholder="Type Here"
          />
        </div>

        </div>
      </div>

    </ul>
  </div>
  <div class="container mt-3" *ngFor="let obj of objectives; let i = index;">
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3" style="margin-top: 6px;">ATTENDANCE</div>
          <div class="dropdown">
            <button class="btn btn-dark dropdown-toggle m-3"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 44px">
              {{  obj.attendanceRating ||'Select HR Rating' }}
            </button>

            <ul class="dropdown-menu dropdown-menu-dark"
                style="background-color: #33343C;">
              <li *ngFor="let type of rating">
                <a class="dropdown-item text-light"
                   (click)="onAttendanceRating(obj,type)"
                >
                  {{ type }}
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>

    </ul>
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3" style="margin-top: 6px;">LEAVE</div>
          <div class="dropdown">
            <button class="btn btn-dark dropdown-toggle m-3"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 44px">
              {{  obj.leaveRating ||'Select HR Rating' }}
            </button>

            <ul class="dropdown-menu dropdown-menu-dark"
                style="background-color: #33343C;">
              <li *ngFor="let type of rating">
                <a class="dropdown-item text-light"
                   (click)="onLeaveRating(obj,type)"
                >
                  {{ type }}
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>

    </ul>
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3" style="margin-top: 6px;">DISCIPLINARY ISSUE</div>
          <div class="dropdown">
            <button class="btn btn-dark dropdown-toggle m-3"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 44px">
              {{  obj.issueRating ||'Select HR Rating' }}
            </button>

            <ul class="dropdown-menu dropdown-menu-dark"
                style="background-color: #33343C;">
              <li *ngFor="let type of rating">
                <a class="dropdown-item text-light"
                   (click)="onIssueRating(obj,type)"
                >
                  {{ type }}
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>

    </ul>
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-between">
          <div class="fw-semibold p-3" style="margin-top: 6px;">AWARD/RECOGNITION</div>
          <div class="dropdown">
            <button class="btn btn-dark dropdown-toggle m-3"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    style="background-color:#33343C; border:1px solid #7A7B8299;padding: 6px 44px">
              {{  obj.awardRating ||'Select HR Rating' }}
            </button>

            <ul class="dropdown-menu dropdown-menu-dark"
                style="background-color: #33343C;">
              <li *ngFor="let type of rating">
                <a class="dropdown-item text-light"
                   (click)="onAwardRating(obj,type)"
                >
                  {{ type }}
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>

    </ul>
  </div>
</div>
