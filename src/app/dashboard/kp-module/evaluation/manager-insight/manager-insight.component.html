<div class="objectives-card p-4 rounded">
  <h5 class="text-light fw-semibold">Manager's Insight</h5>


  <div class="container mt-3">
    <ul class="list-group">
      <div class="work-obj">
        <div class="d-flex justify-content-start">
          <div class="fw-semibold p-3">Category</div>
        </div>
        <div *ngFor="let obj of objectives; let i = index;" class="objective-box p-3 text-light"
             [ngClass]="{ 'bg-open': obj.isOpen }">

          <div class="d-flex justify-content-between align-items-center"

               style="cursor:pointer;">
            <div class="d-flex justify-content-between"  (click)="toggleObjective(obj)">
              <div>
                <img src="../../../assets/work_obj.svg" class="mb-1" style="scale:0.7"  />
              </div>
              <span class="fw-semibold">{{ obj.name }}</span>
            </div>
          </div>
          <div *ngIf="obj.isOpen" class="collapse-content">
            <hr style="width: 104%;margin-left: -18px;">
            <input
              type="text"
              class="obj-input mb-2"
              [(ngModel)]="obj.objectiveText"
              placeholder="Type Here"
            />
          </div>
        </div>

      </div>
    </ul>
  </div>

  <div class="container mt-3">
    <div class="d-flex justify-content-between">
      <div>
        <button class="btn cancel-btn" (click)="onBack()">Cancel</button>
      </div>
      <div>
        <div class="d-flex justify-content-end gap-2 p-3">
          <button class=" cancel-btn" (click)="onBack()">Back</button>
          <button class=" submit-btn" (click)="onNext()">Submit</button>
        </div>
      </div>

    </div>

  </div>
</div>
