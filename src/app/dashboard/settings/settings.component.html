<div style="background-color: #25262C">

  <div class="kpi-header">
    <div class="row justify-content-between text-center kpi-tabs" *ngIf="showEvaluation">
      <div
        class="tab col"
        (click)="changeTable('initiation')"
        [ngClass]="{ active: !tables.initiation.selected }">
        KPI INITIATION
      </div>
<!--      <div-->
<!--        class="tab col"-->
<!--        (click)="changeTable('modification')"-->
<!--        [ngClass]="{ active: !tables.modification.selected }">-->
<!--        KPI MODIFICATION-->
<!--      </div>-->
      <div *ngIf="showEvaluation"
        class="tab col"
        (click)="changeTable('evaluation')"
        [ngClass]="{ active: !tables.evaluation.selected }">
        KPI EVALUATION
      </div>
    </div>
    <div class="row justify-content-start kpi-tabs" *ngIf="!showEvaluation">
      <div
        class="tab col" style="margin-left: 50px;"
        (click)="changeTable('initiation')"
        [ngClass]="{ active: !tables.initiation.selected }">
        KPI INITIATION
      </div>
    </div>
  </div>


  <div class="modal-body">
    <!-- KPI Initiation -->
    <fieldset *ngIf="currentTable=='initiation'">
      <app-initial [tabs]="this.tab" [mode]="this.mode" (showProceed)="getProceedButton($event)" (selectedDates)="getSelectedEndDate($event)" >

      </app-initial>

    </fieldset>

    <fieldset *ngIf="currentTable=='evaluation'">
      <app-initial [tabs]="this.tab" [mode]="this.mode" (selectedDatesEva)="getSelectedEndDate($event)">

      </app-initial>

    </fieldset>
  </div>

  <footer class="footer-section">
    <div class="d-flex justify-content-end gap-2" style="margin-right: 44px; padding-bottom: 30px; padding-top: 20px;">
      <button class="cancel-btn" (click)="closePopup()">Cancel</button>
      <button class="submit-btn"
              [disabled]="
                (currentTable === 'initiation' && (!selectedDate || ['evaluation', 'initiation_expired', 'evaluation_expired'].includes(timePeriod) )) ||
                (currentTable === 'evaluation' && (!selectedDateEva || timePeriod === 'evaluation_expired'))
              "
              [ngClass]="{
                'disabled-submit-btn':
                  (currentTable === 'initiation' && (!selectedDate || ['evaluation', 'initiation_expired', 'evaluation_expired'].includes(timePeriod))) ||
                  (currentTable === 'evaluation' && (!selectedDateEva || timePeriod === 'evaluation_expired'))
              }"
              (click)="statusAction(actionModal)"
      >Active</button>
    </div>
  </footer>

</div>
<ng-template #actionModal>

    <div class="modal-content" style="background-color: #25262C;border: 1px solid #25262C;border-radius: 0px;">

      <div class="modal-body modal-message-body" style="display: flex;flex-direction: column;top: 25%">
        <div class="d-flex justify-content-center text-center " >
          <div *ngIf="tab === 'initiation'" style="color: white; font-size: 16px;">Are you sure you want to activate the KPI Initiation?  </div>
          <div *ngIf="tab != 'initiation'" style="color: white; font-size: 16px;">Are you sure you want to activate the KPI Evaluation?  </div>
        </div>


      </div>
      <div class="">
        <div class="d-flex justify-content-center gap-2" style="margin-right: 44px; padding-bottom: 30px; padding-top: 20px;">
          <button class="btn close-btn" style="cursor: pointer;" (click)="closeModal()">Close</button>
          <button class="btn active-btn" style="cursor: pointer;"
                  (click)="tab === 'initiation'? onActive() : onActiveEva();">Confirm</button>
        </div>
      </div>

    </div>
</ng-template>
