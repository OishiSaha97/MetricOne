<div class="nav-bar-bg nav-height nav-width">
  <aside class="main-sidebar elevation-3 d-flex flex-column" style="overflow: hidden;">
    <div class="p-2 flex-shrink-0">
      <a class="brand-link shadow-box" #brand style="padding: .33rem;line-height: initial">

        <img src="../../assets/logo-nav.svg" class="img-fluid mb-3 logo-small" alt="Logo" />

      </a>

      <div class="search-wrapper">
        <img src="../../../assets/magnifine-bar.svg" class="search-icon" alt="Search icon" />
        <input type="text" class="search-input" placeholder="Search" />
      </div>
      <!--    <div class="sidebar sidebar-margin-0"-->
      <!--         [style.height]="sanitizer.bypassSecurityTrustStyle('calc(100% - '+brand.offsetHeight+'px)')">-->

      <!--    </div>-->
      <nav class="mt-2 flex-grow-1" style="font-size: 12px!important;">
        <ul class="nav nav-pills pr-1 nav-sidebar flex-column">
          <ng-container *ngFor="let superTask of superTasks; let i = index">
            <li class="nav-item" >
              <div class="nav-link   sidebar-item" [class.active-item]="active"  (click)="openTask();">
                <div class="left-content">
                  <img class="nav-icon task-icon" src="assets/coolicon.svg" alt="icon">
                  {{ superTask.name }}
                </div>
                <i class="right top-up" [class.rotated]="active"></i>
              </div>
              <div *ngIf="active==true">
                <ul class="nav nav-treeview" >
                  <li class="nav-item sided"
                    *ngFor="let subTask of superTask.subTasks"
                    routerLinkActive="active" >
                    <div
                      (click)="navigateTo(subTask.routePath)"
                      class="mt-2 nav-link subtask"
                      [class.active-subtask]="activeSubTask === subTask.routePath"
                    >
                      <p class="subtask-text">
                        {{ subTask.name }}
                      </p>

                    </div>
                  </li>
                </ul>
              </div>

            </li>


          </ng-container>

        </ul>


      </nav>



    </div>
    <footer class="sidebar-footer p-2">
      <div>
        <img src="../../../assets/avatar.svg" class="avatar mb-1" style="scale:0.7"  />
      </div>
      <div>
        <p style="margin: 0; color: white;">{{ name }}</p>
        <p style="margin: 0; font-size: 12px; color: white;">{{ designation }}</p>
      </div>

      <button class="btn btn-sm btn-outline-light mt-1 ml-1 logout-icon" (click)="logout()"></button>
    </footer>

  </aside>
</div>
